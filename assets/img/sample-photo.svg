<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5eee6"/>
      <stop offset="50%" stop-color="#ebd8c3"/>
      <stop offset="100%" stop-color="#dfcaa7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b5d33"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Ornaments / Floral Icon -->
  <g transform="translate(200, 150) scale(1.1)">
    <!-- Heart Rings / Wedding Bands -->
    <circle cx="-25" cy="0" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="25" cy="0" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <polygon points="0,-48 6,-38 16,-38 8,-30 11,-20 0,-26 -11,-20 -8,-30 -16,-38 -6,-38" fill="#d4af37"/>
  </g>

  <!-- Elegant Floral Leaves -->
  <path d="M 120 220 C 140 200, 170 210, 180 230 C 160 235, 140 230, 120 220 Z" fill="#8b5d33" opacity="0.6"/>
  <path d="M 280 220 C 260 200, 230 210, 220 230 C 240 235, 260 230, 280 220 Z" fill="#8b5d33" opacity="0.6"/>

  <!-- Text -->
  <text x="200" y="270" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#6f4724" text-anchor="middle" letter-spacing="3">THE WEDDING OF</text>
  <text x="200" y="305" font-family="'Great Vibes', cursive, serif" font-size="34" fill="#8b5d33" text-anchor="middle">Romeo &amp; Juliet</text>
  <text x="200" y="335" font-family="sans-serif" font-size="11" fill="#7d6a58" text-anchor="middle" letter-spacing="1">GANTI DENGAN FOTO ANDA</text>
</svg>
